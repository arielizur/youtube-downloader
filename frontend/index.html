<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוריד יוטיוב | YouTube Downloader</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header>
            <h1>הורדת סרטונים 🎬</h1>
            <p>הכנס קישור, בחר פורמט, והורד בקלות.</p>
        </header>

        <form id="download-form">
            <div class="input-group" style="display: none;">
                <label for="base-url">אתר המרה (Base URL)</label>
                <input type="url" id="base-url" value="https://convertytmp3.org" placeholder="https://convertytmp3.org">
            </div>

            <div class="input-group">
                <label for="youtube-url">קישור לסרטון יוטיוב</label>
                <input type="url" id="youtube-url" required placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
            </div>

            <div class="input-group">
                <label for="format">פורמט</label>
                <select id="format">
                    <option value="mp4">MP4 (וידאו)</option>
                    <option value="mp3">MP3 (שמע)</option>
                </select>
            </div>

            <button type="submit" id="submit-btn">התחל הורדה</button>
        </form>

        <div id="status-card" class="hidden">
            <div class="loader-container" id="loader-container">
                <div class="loader"></div>
            </div>
            <h3 id="status-title">מעבד בקשה...</h3>
            <p id="status-message">אנא המתן.</p>
            <a id="download-link" class="hidden btn-success" href="#" download>שמור קובץ במחשב</a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
